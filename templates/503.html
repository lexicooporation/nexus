<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexus — Under Maintenance</title>

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --nx-navy:    #0B1120;
      --nx-blue:    #2563EB;
      --nx-blue-lt: #EFF6FF;
      --nx-gray:    #64748B;
      --nx-border:  #E2E8F0;
      --nx-white:   #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--nx-navy);
      color: var(--nx-white);
      min-height: 100vh;
      display: flex;
      padding: auto;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      scroll-behavior: smooth;
    }

    /* ── Animated background ──────────────────────────── */
    .bg-mesh {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(37,99,235,.45) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(63, 156, 255, 0.35) 0%, transparent 55%),
        radial-gradient(ellipse at 60% 80%, rgba(37,99,235,.25)  0%, transparent 50%);
      animation: meshShift 10s ease-in-out infinite alternate;
    }
    @keyframes meshShift {
      0%   { transform: scale(1)    rotate(0deg); }
      100% { transform: scale(1.1)  rotate(4deg); }
    }


    .bg-orb {
      position: fixed; border-radius: 50%;
      animation: orbFloat ease-in-out infinite;
      z-index: 0;
    }
    .bg-orb-1 { width:350px; height:350px;  background:rgba(37,99,235,.22);   top:-80px;    right:-80px;  animation-duration:8s; }
    .bg-orb-2 { width:250px; height:250px;  background:rgba(76, 125, 233, 0.22);  bottom:-60px; left:-60px;   animation-duration:11s; animation-delay:1s; }
    .bg-orb-3 { width:120px; height:120px;  background:rgba(37,99,235,.22);    bottom:25%;   right:15%;    animation-duration:7s;  animation-delay:2s; }
    @keyframes orbFloat {
      0%,100% { transform: translateY(0)     scale(1); }
      50%      { transform: translateY(-20px) scale(1.04); }
    }

    /* ── Card ─────────────────────────────────────────── */
    .maintenance {
      position: relative; z-index: 1;
      padding: 3.5rem;
      max-width: 520px;
      width: calc(100% - 2rem);
      text-align: center;
      
    }

    /* ── Logo ─────────────────────────────────────────── */
    .brand {
      font-family: 'Sora', sans-serif;
      font-weight: 800; font-size: 1.35rem;
      color: var(--nx-white); letter-spacing: -.02em;
      display: inline-flex; align-items: center; gap: .45rem;
      margin-bottom: 2rem;
      text-decoration: none;
    }
    .brand i { color: var(--nx-blue); }

    /* ── Icon ─────────────────────────────────────────── */
    .icon-wrap {
      width: 72px; height: 72px; border-radius: 20px;
      background: rgba(37,99,235,.2);
      border: 1px solid rgba(37,99,235,.3);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.75rem;
      font-size: 2rem;
      animation: iconPulse 2.5s ease-in-out infinite;
    }
    @keyframes iconPulse {
      0%,100% { box-shadow: 0 0 0 0    rgba(37,99,235,.3); }
      50%      { box-shadow: 0 0 0 12px rgba(37,99,235,.0); }
    }

    /* ── Text ─────────────────────────────────────────── */
    h1 {
      font-family: 'Sora', sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.1rem);
      font-weight: 700; letter-spacing: -.02em;
      color: var(--nx-white); line-height: 1.2;
      margin-bottom: .75rem;
    }
    .subtitle {
      color: rgba(255,255,255,.6);
      font-size: .95rem; line-height: 1.65;
      max-width: 380px; margin: 0 auto 2rem;
    }

    /* ── Status pills ─────────────────────────────────── */
    .status-row {
      display: flex; flex-wrap: wrap; gap: .6rem;
      justify-content: center; margin-bottom: 2rem;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: .4rem;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 99px; padding: .35rem .9rem;
      font-size: .78rem; font-weight: 500;
      color: rgba(255,255,255,.75);
    }
    .status-pill .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #22C55E;
      animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; }
      50%      { opacity: .3; }
    }

    .progress-label {
      display: flex; justify-content: space-between;
      font-size: .75rem; color: rgba(255,255,255,.4);
      margin-bottom: .5rem;
    }

    /* ── Divider ──────────────────────────────────────── */
    .divider {
      border: none; border-top: 1px solid rgba(255,255,255,.08);
      margin: 1.75rem 0;
    }

    /* ── Contact link ─────────────────────────────────── */
    .contact-note {
      font-size: .82rem; color: rgba(255,255,255,.45);
    }
    .contact-note a {
      color: rgba(255,255,255,.7);
      text-decoration: underline; text-underline-offset: 2px;
      transition: color .15s;
    }
    .contact-note a:hover { color: var(--nx-white); }

    /* ── Footer ──────────────────────────────────────── */
    .page-footer {
      position: relative; z-index: 1;
      margin-top: 2rem;
      font-size: .78rem; color: rgba(255,255,255,.3);
    }

    @media (max-width: 480px) {
      .maintenance { padding: 2.25rem 1.75rem; }
    }
  </style>
</head>
<body>

  <!-- Background layers -->
  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>

  <!-- Card -->
  <div class="maintenance">

    <a href="/" class="brand">
      <i class="bi bi-bullseye"></i> Nexus
    </a>

    <div class="icon-wrap">
      <i class="bi bi-tools" style="color:var(--nx-blue)"></i>
    </div>

    <h1>We're under maintenance</h1>
    <p class="subtitle">
      We're making some improvements to give you a better experience.
      We'll be back shortly — thanks for your patience.
    </p>

    <div class="status-row">
      <span class="status-pill"><span class="dot"></span> In progress</span>
      <span class="status-pill"><i class="bi bi-clock me-1"></i> Est. 30 minutes</span>
      <span class="status-pill"><i class="bi bi-shield-check me-1"></i> Data is safe</span>
    </div>

    <div class="progress-label">
      <span>Maintenance progress</span>
      <span>70%</span>
    </div>
   

    <hr class="divider">

    <p class="contact-note">
      Need urgent help?
      <a href="mailto:hello@nexus.io">hello@nexus.io</a>
    </p>

  </div>

  <p class="page-footer">2026 © Nexus Inc. &nbsp;·&nbsp; All rights reserved.</p>

</body>
</html>
