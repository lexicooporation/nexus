{% extends "base.html" %}
{% block title %}Password updated — Nexus{% endblock %}

{% block extra_css %}
<style>
  .nx-confirm-page {
    min-height: calc(100vh - 70px);
    display: flex; align-items: center; justify-content: center;
    background: var(--nx-light); padding: 3rem 1rem;
  }
  .nx-confirm-card {
    background: var(--nx-white);
    border: 1px solid var(--nx-border);
    border-radius: var(--nx-radius-lg);
    padding: 3rem 2.5rem;
    max-width: 460px; width: 100%;
    text-align: center;
    box-shadow: var(--nx-shadow);
  }
  .nx-success-icon {
    width: 72px; height: 72px; border-radius: 50%;
    background: #F0FDF4;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; color: #16A34A;
    margin: 0 auto 1.5rem;
  }
  .nx-confirm-title {
    font-family: 'Sora', sans-serif;
    font-size: 1.5rem; font-weight: 700; color: var(--nx-navy);
    margin-bottom: .5rem;
  }
</style>
{% endblock %}

{% block content %}
<div class="nx-confirm-page">
  <div class="nx-confirm-card">
    <div class="nx-success-icon">
      <i class="bi bi-check-circle-fill"></i>
    </div>
    <h1 class="nx-confirm-title">Password updated!</h1>
    <p style="color:var(--nx-gray);font-size:.95rem;line-height:1.7;margin-bottom:1.75rem">
      Your password has been changed successfully. You can now log in with your new password.
    </p>
    <a href="{% url 'login' %}" class="btn-nx-primary"
       style="padding:.75rem 2rem;font-size:.9rem;border-radius:var(--nx-radius);display:inline-block">
      Log in <i class="bi bi-box-arrow-in-right ms-1"></i>
    </a>
  </div>
</div>
{% endblock %}
